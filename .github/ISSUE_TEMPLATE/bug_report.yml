name: Bug report
description: Report a reproducible problem in the Skill, state tools, installers, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, personal learning data, and copyrighted source material before submitting.
  - type: input
    id: version
    attributes:
      label: Philomatheia version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skill behavior
        - State initialization
        - State validation
        - Installation or update
        - Documentation
        - GitHub Actions or release archive
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact output
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the prompt or command, operating system, host, and relevant redacted state.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and private learner data.
          required: true
