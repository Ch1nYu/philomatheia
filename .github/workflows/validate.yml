name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public package
        run: python scripts/check_package.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python scripts
        run: python -m py_compile scripts/init_project.py scripts/validate_state.py scripts/check_package.py scripts/build_release.py
      - name: Build release archive
        run: python scripts/build_release.py

  install-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preview installation
        shell: pwsh
        run: .\install.ps1 -DestinationRoot "$env:RUNNER_TEMP\skills" -WhatIf
      - name: Install and update
        shell: pwsh
        run: |
          .\install.ps1 -DestinationRoot "$env:RUNNER_TEMP\skills"
          if (-not (Test-Path "$env:RUNNER_TEMP\skills\philomatheia\SKILL.md")) { throw "SKILL.md was not installed" }
          if (Test-Path "$env:RUNNER_TEMP\skills\philomatheia\README.md") { throw "Repository-only files entered the runtime install" }
          if (Test-Path "$env:RUNNER_TEMP\skills\philomatheia\scripts\check_package.py") { throw "Repository tooling entered the runtime install" }
          .\install.ps1 -DestinationRoot "$env:RUNNER_TEMP\skills" -Update
      - name: Install into several skills directories
        shell: pwsh
        run: |
          $rootA = "$env:RUNNER_TEMP\multiA"
          $rootB = "$env:RUNNER_TEMP\multiB"
          .\install.ps1 -DestinationRoot $rootA, $rootB
          if (-not (Test-Path "$rootA\philomatheia\SKILL.md")) { throw "First destination was not installed" }
          if (-not (Test-Path "$rootB\philomatheia\SKILL.md")) { throw "Second destination was not installed" }
          $refused = $false
          try { .\install.ps1 -DestinationRoot $rootA, $rootB } catch { $refused = $true }
          if (-not $refused) { throw "Installer replaced an existing installation without -Update" }
          .\install.ps1 -DestinationRoot $rootA, $rootB -Update
      - name: Choose agents instead of defaulting to them
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}\pshome
          USERPROFILE: ${{ runner.temp }}\pshome
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          New-Item -ItemType Directory -Path (Join-Path $HOME '.claude') -Force | Out-Null
          .\install.ps1 -ListTargets
          .\install.ps1
          if ($LASTEXITCODE -eq 0) { throw "Installer picked a destination without being told to" }
          # A PowerShell script that returns normally leaves $LASTEXITCODE alone,
          # and the runner ends the step with exit $LASTEXITCODE.
          $global:LASTEXITCODE = 0
          if (Test-Path (Join-Path $HOME '.claude\skills\philomatheia')) { throw "Installer wrote to an agent directory nobody selected" }
          if (Test-Path (Join-Path $HOME '.agents')) { throw "Installer created an agent directory nobody selected" }
          .\install.ps1 -All
          if (-not (Test-Path (Join-Path $HOME '.claude\skills\philomatheia\SKILL.md'))) { throw "-All skipped the agent that is present" }
          if (Test-Path (Join-Path $HOME '.agents')) { throw "-All created a directory for an absent agent" }

  install-posix:
    name: POSIX installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Preview installation
        run: sh ./install.sh --dest-root "$RUNNER_TEMP/skills" --dry-run
      - name: Install and update
        run: |
          sh ./install.sh --dest-root "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/philomatheia/SKILL.md"
          test ! -f "$RUNNER_TEMP/skills/philomatheia/README.md"
          test ! -f "$RUNNER_TEMP/skills/philomatheia/scripts/check_package.py"
          sh ./install.sh --dest-root "$RUNNER_TEMP/skills" --update
      - name: Install for every agent found on the machine
        env:
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          fake="$RUNNER_TEMP/home"
          mkdir -p "$fake/.claude" "$fake/.codex" "$fake/.config/goose"
          export XDG_CONFIG_HOME="$fake/.config"
          HOME="$fake" sh ./install.sh --list | grep -qE "Claude Code +found, not installed"
          HOME="$fake" sh ./install.sh --all
          test -f "$fake/.claude/skills/philomatheia/SKILL.md"
          test -f "$fake/.agents/skills/philomatheia/SKILL.md"
          test -f "$fake/.config/agents/skills/philomatheia/SKILL.md"
          test ! -f "$fake/.claude/skills/philomatheia/README.md"
          HOME="$fake" sh ./install.sh --list | grep -qE "Claude Code +installed"
          if HOME="$fake" sh ./install.sh --all; then
            echo "Installer replaced an existing installation without --update" >&2
            exit 1
          fi
          HOME="$fake" sh ./install.sh --all --update
      - name: Choose agents instead of defaulting to them
        env:
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          bare="$RUNNER_TEMP/barehome"
          mkdir -p "$bare/.claude"
          export XDG_CONFIG_HOME="$bare/.config"
          if HOME="$bare" sh ./install.sh; then
            echo "Installer picked a destination without being told to" >&2
            exit 1
          fi
          test ! -e "$bare/.claude/skills/philomatheia"
          test ! -e "$bare/.agents"
          if HOME="$RUNNER_TEMP/emptyhome" XDG_CONFIG_HOME="$RUNNER_TEMP/emptyhome/.config" sh ./install.sh --all; then
            echo "--all installed somewhere with no agent present" >&2
            exit 1
          fi
      - name: Install by agent name, sharing one directory
        env:
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          named="$RUNNER_TEMP/namedhome"
          mkdir -p "$named"
          export XDG_CONFIG_HOME="$named/.config"
          HOME="$named" sh ./install.sh --agent codex --agent cursor | tee "$RUNNER_TEMP/named.log"
          test -f "$named/.agents/skills/philomatheia/SKILL.md"
          grep -q "serves Codex CLI, Cursor" "$RUNNER_TEMP/named.log"
          test "$(grep -c '^Installed philomatheia' "$RUNNER_TEMP/named.log")" = "1"
          HOME="$named" sh ./install.sh --agent claude-code
          test -f "$named/.claude/skills/philomatheia/SKILL.md"
          if HOME="$named" sh ./install.sh --agent not-an-agent; then
            echo "Installer accepted an unknown agent name" >&2
            exit 1
          fi

  # Windows coverage for the npx entry point comes from NpmEntryPointTests in
  # the test job, which handles Windows paths without a shell in the way.
  install-npx:
    name: npx entry point on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install from a packed tarball
        shell: bash
        env:
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          node --version
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/philomatheia-$(cat VERSION).tgz"
          skills="$RUNNER_TEMP/npx-skills"
          # A tarball spec carries no package name for npx to derive the command
          # from, so name both. Published, `npx philomatheia` needs neither.
          run_npx() {
            npx --yes --package "$tarball" -- philomatheia "$@"
          }
          run_npx --list
          run_npx --dest-root "$skills"
          test -f "$skills/philomatheia/SKILL.md"
          test -f "$skills/philomatheia/scripts/validate_state.py"
          test ! -e "$skills/philomatheia/README.md"
          test ! -e "$skills/philomatheia/install.sh"
          test ! -e "$skills/philomatheia/package.json"
          if run_npx --dest-root "$skills"; then
            echo "npx entry point replaced an existing installation without --update" >&2
            exit 1
          fi
          run_npx --dest-root "$skills" --update
          if run_npx; then
            echo "npx entry point picked a destination without being told to" >&2
            exit 1
          fi
      - name: Link the binary under the name npx will resolve
        shell: bash
        env:
          PHILOMATHEIA_NON_INTERACTIVE: "1"
        run: |
          tarball="$RUNNER_TEMP/philomatheia-$(cat VERSION).tgz"
          prefix="$RUNNER_TEMP/npm-prefix"
          npm install -g --prefix "$prefix" "$tarball"
          export PATH="$prefix/bin:$PATH"
          command -v philomatheia
          philomatheia --list
